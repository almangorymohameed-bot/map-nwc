<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Global PWA prompt listener captured as early as possible
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        console.log('PWA beforeinstallprompt captured globally');
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPWAInstallPrompt = null;
        console.log('PWA successfully installed');
      });

      // Instantly catch any errors from external cross-origin iframes or CDNs
      window.onerror = function(message, source, lineno, colno, error) {
        console.warn("Global suppressed script error:", message, "from", source);
        return true; // Completely suppress
      };
      window.addEventListener('error', function(event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }, { capture: true });
      window.addEventListener('unhandledrejection', function(event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }, { capture: true });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الخرائط التفاعلية" />
    <title>الخرائط التفاعلية NWC</title>
    
    <!-- أيقونة وشعار تطبيق الخرائط التفاعلية PWA -->
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.warn('SW registration failed:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
