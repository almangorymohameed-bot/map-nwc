<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      // Instantly catch any errors from external cross-origin iframes or CDNs
      window.onerror = function(message, source, lineno, colno, error) {
        console.warn("Global suppressed script error:", message, "from", source);
        return true; // Completely suppress
      };
      window.addEventListener('error', function(event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }, { capture: true });
      window.addEventListener('unhandledrejection', function(event) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }, { capture: true });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الخرائط التفاعلية NWC</title>
    
    <!-- أيقونة الخرائط التفاعلية الذكية -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
